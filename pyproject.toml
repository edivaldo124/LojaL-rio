[project]
name = "lojalirio"
version = "0.1.0"
description = "Loja virtual de moda feminina (Flask)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "C4", "BLE"]
ignore = [
  "S101",   # assert nos testes
  "RUF001", # aspas tipográficas e travessões nos textos em português
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"seed.py" = ["S311"]  # random só para desenhar as ilustrações

[tool.mypy]
python_version = "3.13"
packages = ["blueprints", "formularios", "modelos", "servicos"]
modules = ["app", "config", "config_loja", "extensoes", "seed", "servidor"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["authlib.*", "flask_login", "flask_migrate", "flask_wtf.*", "wtforms.*", "segno", "flask_limiter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:authlib.*"]
